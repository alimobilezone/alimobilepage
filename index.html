<style>
  /* ---------- Tokens ---------- */
  :root{
    --ink:        #0E0D10;
    --ink-soft:   #16141A;
    --ink-raised: #1E1B22;
    --line:       rgba(233, 222, 196, 0.12);
    --line-strong:rgba(233, 222, 196, 0.22);
    --gold:       #C9A227;
    --gold-bright:#E8C468;
    --gold-deep:  #8A6A1C;
    --paper:      #F4EFE4;
    --paper-dim:  #B7AF9F;
    --paper-faint:#7E786C;
    --danger:     #C9524C;

    --font-head: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;

    --radius-s: 4px;
    --radius-m: 10px;
    --radius-l: 22px;

    --container: 1180px;
    --gutter: clamp(20px, 5vw, 64px);
  }

  /* Brand is fixed dark regardless of system theme; tokens are still
     redeclared per the platform's theme contract. */
  @media (prefers-color-scheme: light){ :root{ --ink:#0E0D10; --ink-soft:#16141A; --ink-raised:#1E1B22; --paper:#F4EFE4; } }
  @media (prefers-color-scheme: dark){  :root{ --ink:#0E0D10; --ink-soft:#16141A; --ink-raised:#1E1B22; --paper:#F4EFE4; } }
  :root[data-theme="light"]{ --ink:#0E0D10; --ink-soft:#16141A; --ink-raised:#1E1B22; --paper:#F4EFE4; }
  :root[data-theme="dark"]{  --ink:#0E0D10; --ink-soft:#16141A; --ink-raised:#1E1B22; --paper:#F4EFE4; }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  img,svg{ max-width:100%; display:block; }

  a{ color:inherit; text-decoration:none; }

  h1,h2,h3,h4{
    font-family:var(--font-head);
    font-weight:600;
    line-height:1.12;
    margin:0;
    letter-spacing:-0.01em;
  }

  p{ margin:0; }

  .container{
    max-width:var(--container);
    margin-inline:auto;
    padding-inline:var(--gutter);
  }

  .skip-link{
    position:absolute; left:-999px; top:0;
    background:var(--gold); color:var(--ink); padding:12px 18px;
    border-radius:var(--radius-s); z-index:200; font-weight:600;
  }
  .skip-link:focus{ left:16px; top:16px; }

  :focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }

  ::selection{ background:var(--gold); color:var(--ink); }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-body); font-weight:600; font-size:15px;
    padding:13px 26px; border-radius:999px; border:1px solid transparent;
    cursor:pointer; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#1A1404; }
  .btn-primary:hover{ background:linear-gradient(180deg,#f0d17c,var(--gold-bright)); }
  .btn-outline{ background:transparent; color:var(--paper); border-color:var(--line-strong); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-ghost{ background:transparent; color:var(--gold-bright); padding:6px 0; border-radius:0; font-size:14px; }
  .btn-ghost:hover{ color:var(--paper); }
  .btn-block{ width:100%; }

  /* ---------- Nav ---------- */
  .site-header{
    position:sticky; top:0; z-index:100;
    background:rgba(14,13,16,0.72);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid transparent;
    transition:border-color .25s ease, background .25s ease;
  }
  .site-header.is-scrolled{ border-bottom-color:var(--line); background:rgba(14,13,16,0.92); }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:14px;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{ width:38px; height:38px; flex:none; }
  .brand-name{ font-family:var(--font-head); font-size:17px; font-weight:600; color:var(--paper); }
  .brand-name span{ color:var(--gold-bright); }

  .nav-links{ display:flex; align-items:center; gap:34px; }
  .nav-links a{ font-size:14.5px; color:var(--paper-dim); transition:color .18s ease; position:relative; }
  .nav-links a:hover{ color:var(--paper); }
  .nav-links a::after{
    content:""; position:absolute; left:0; bottom:-6px; width:0; height:1px;
    background:var(--gold); transition:width .2s ease;
  }
  .nav-links a:hover::after{ width:100%; }

  .nav-cta{ display:flex; align-items:center; gap:18px; }
  .nav-toggle{
    display:none; background:none; border:1px solid var(--line-strong); border-radius:8px;
    width:42px; height:42px; align-items:center; justify-content:center; color:var(--paper);
  }
  .nav-toggle svg{ width:20px; height:20px; }

  .mobile-panel{
    display:none; flex-direction:column; gap:2px; padding:8px var(--gutter) 22px;
    border-bottom:1px solid var(--line); background:var(--ink-soft);
  }
  .mobile-panel a{ padding:13px 4px; font-size:15px; color:var(--paper-dim); border-bottom:1px solid var(--line); }
  .mobile-panel a:last-child{ border-bottom:none; }
  .mobile-panel.is-open{ display:flex; }

  @media (max-width: 880px){
    .nav-links{ display:none; }
    .nav-cta .btn-outline{ display:none; }
    .nav-toggle{ display:flex; }
  }

  /* ---------- Section rhythm ---------- */
  section{ padding-block:clamp(64px, 9vw, 128px); position:relative; }
  .section-head{ max-width:640px; margin-bottom:clamp(36px,5vw,64px); }
  .kicker{
    display:inline-flex; align-items:center; gap:9px;
    font-size:13.5px; color:var(--gold-bright); font-weight:500; margin-bottom:14px;
  }
  .kicker::before{ content:""; width:18px; height:1px; background:var(--gold); }
  .section-head h2{ font-size:clamp(28px,4vw,42px); color:var(--paper); }
  .section-head p{ margin-top:16px; color:var(--paper-dim); font-size:17px; max-width:56ch; }

  /* ---------- Hero ---------- */
  .hero{ padding-top:clamp(56px,8vw,96px); overflow:hidden; }
  .hero .container{
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(32px,5vw,64px);
    align-items:center;
  }
  .hero-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:22px; color:var(--paper-dim); font-size:14px; }
  .hero-eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(201,162,39,0.18); }
  .hero h1{
    font-size:clamp(38px, 5.6vw, 64px);
    color:var(--paper);
    max-width:12ch;
  }
  .hero h1 em{ font-style:normal; color:var(--gold-bright); }
  .hero-desc{ margin-top:22px; font-size:18px; color:var(--paper-dim); max-width:46ch; }
  .hero-ctas{ display:flex; flex-wrap:wrap; gap:14px; margin-top:34px; }
  .hero-trust{ display:flex; gap:28px; margin-top:44px; flex-wrap:wrap; }
  .hero-trust div{ }
  .hero-trust strong{ display:block; font-family:var(--font-head); font-size:22px; color:var(--paper); }
  .hero-trust span{ font-size:13px; color:var(--paper-faint); }

  .hero-art{ position:relative; }
  .hero-art svg{ width:100%; height:auto; }

  .reveal{ opacity:0; transform:translateY(14px); animation:heroIn .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .reveal.d1{ animation-delay:.05s; }
  .reveal.d2{ animation-delay:.15s; }
  .reveal.d3{ animation-delay:.25s; }
  .reveal.d4{ animation-delay:.35s; }
  @keyframes heroIn{ to{ opacity:1; transform:translateY(0); } }

  .draw{ stroke-dasharray:900; stroke-dashoffset:900; animation:drawLine 1.6s ease-out forwards .3s; }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }

  @media (max-width: 900px){
    .hero .container{ grid-template-columns:1fr; }
    .hero-art{ order:-1; max-width:420px; margin-inline:auto; }
  }

  /* ---------- About ---------- */
  .about .container{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:clamp(32px,6vw,80px); align-items:start; }
  .about-visual{ position:sticky; top:100px; }
  .about-card{
    border:1px solid var(--line); border-radius:var(--radius-l);
    padding:30px; background:linear-gradient(160deg, var(--ink-raised), var(--ink-soft));
  }
  .about-card svg{ width:100%; height:auto; margin-bottom:20px; }
  .about-card p{ color:var(--paper-dim); font-size:15px; }
  .value-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .value-list li{
    display:flex; gap:16px; padding-block:22px; border-top:1px solid var(--line);
  }
  .value-list li:first-child{ border-top:none; }
  .value-num{ font-family:var(--font-head); color:var(--gold); font-size:15px; padding-top:3px; }
  .value-list h3{ font-size:18px; color:var(--paper); margin-bottom:6px; }
  .value-list p{ color:var(--paper-dim); font-size:15px; max-width:54ch; }

  /* ---------- Services ---------- */
  .services{ background:var(--ink-soft); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .service-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; }
  .service-card{
    background:var(--ink); padding:32px 28px; position:relative; transition:background .25s ease;
  }
  .service-card:hover{ background:var(--ink-raised); }
  .service-icon{
    width:46px; height:46px; border-radius:12px; border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
    color:var(--gold-bright); transition:border-color .25s ease, transform .25s ease;
  }
  .service-card:hover .service-icon{ border-color:var(--gold); transform:translateY(-2px); }
  .service-icon svg{ width:22px; height:22px; }
  .service-card h3{ font-size:19px; color:var(--paper); margin-bottom:10px; }
  .service-card p{ color:var(--paper-dim); font-size:14.5px; margin-bottom:16px; }

  @media (max-width: 900px){ .service-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width: 600px){ .service-grid{ grid-template-columns:1fr; } }

  /* ---------- Why us ---------- */
  .why-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:0; border-top:1px solid var(--line); }
  .why-item{ padding:30px 22px 30px 0; border-bottom:1px solid var(--line); }
  .why-item svg{ width:26px; height:26px; color:var(--gold); margin-bottom:16px; }
  .why-item h3{ font-size:16px; color:var(--paper); margin-bottom:8px; }
  .why-item p{ font-size:14px; color:var(--paper-dim); }
  @media (max-width:980px){ .why-grid{ grid-template-columns:repeat(2,1fr); } .why-item{ padding-right:16px; } }
  @media (max-width:560px){ .why-grid{ grid-template-columns:1fr; } }

  /* ---------- Stats ---------- */
  .stats{ background:radial-gradient(120% 140% at 15% 0%, rgba(201,162,39,0.10), transparent 55%), var(--ink); border-bottom:1px solid var(--line); }
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; }
  .stat{ background:var(--ink); padding:34px 24px; text-align:left; }
  .stat strong{ display:block; font-family:var(--font-head); font-size:clamp(30px,4vw,44px); color:var(--gold-bright); }
  .stat span{ font-size:13.5px; color:var(--paper-dim); }
  @media (max-width:760px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Gallery ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:120px; gap:14px;
  }
  .gallery-tile{
    position:relative; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--line);
    background:linear-gradient(155deg,var(--ink-raised),var(--ink-soft));
    display:flex; align-items:flex-end; padding:16px; transition:transform .3s ease, border-color .3s ease;
  }
  .gallery-tile:hover{ transform:translateY(-3px); border-color:var(--gold); }
  .gallery-tile svg{ position:absolute; inset:0; margin:auto; width:46%; height:46%; opacity:0.55; color:var(--gold); }
  .gallery-tile span{ position:relative; font-size:13.5px; color:var(--paper); font-weight:500; background:rgba(14,13,16,0.55); padding:5px 10px; border-radius:6px; }
  .g-a{ grid-column:span 3; grid-row:span 2; }
  .g-b{ grid-column:span 3; grid-row:span 1; }
  .g-c{ grid-column:span 3; grid-row:span 1; }
  .g-d{ grid-column:span 2; grid-row:span 2; }
  .g-e{ grid-column:span 2; grid-row:span 2; }
  .g-f{ grid-column:span 2; grid-row:span 2; }
  .gallery-note{ margin-top:20px; font-size:13px; color:var(--paper-faint); }
  @media (max-width:900px){
    .gallery-grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:150px; }
    .g-a,.g-b,.g-c,.g-d,.g-e,.g-f{ grid-column:span 1; grid-row:span 1; }
  }

  /* ---------- Testimonials ---------- */
  .testimonials{ background:var(--ink-soft); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .t-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  .t-card{ border:1px solid var(--line); border-radius:var(--radius-l); padding:28px; background:var(--ink); }
  .t-stars{ display:flex; gap:3px; margin-bottom:16px; }
  .t-stars svg{ width:15px; height:15px; color:var(--gold); }
  .t-card p{ color:var(--paper); font-size:15.5px; line-height:1.7; }
  .t-person{ display:flex; align-items:center; gap:12px; margin-top:22px; }
  .t-avatar{
    width:42px; height:42px; border-radius:50%; background:linear-gradient(160deg,var(--gold-bright),var(--gold-deep));
    display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-weight:600; color:#1A1404; font-size:14px; flex:none;
  }
  .t-person strong{ display:block; font-size:14.5px; color:var(--paper); }
  .t-person span{ font-size:13px; color:var(--paper-faint); }
  @media (max-width:760px){ .t-grid{ grid-template-columns:1fr; } }

  /* ---------- Contact ---------- */
  .contact .container{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:clamp(28px,5vw,64px); }
  .contact-info{ display:flex; flex-direction:column; gap:22px; }
  .info-row{ display:flex; gap:16px; align-items:flex-start; padding:20px; border:1px solid var(--line); border-radius:var(--radius-m); }
  .info-row svg{ width:20px; height:20px; color:var(--gold-bright); flex:none; margin-top:2px; }
  .info-row strong{ display:block; font-size:14.5px; color:var(--paper); margin-bottom:3px; }
  .info-row span, .info-row a{ font-size:14px; color:var(--paper-dim); }
  .info-row a:hover{ color:var(--gold-bright); }

  .social-row{ display:flex; gap:10px; margin-top:4px; }
  .social-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; color:var(--paper-dim);
    transition:border-color .2s ease, color .2s ease;
  }
  .social-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .social-btn svg{ width:17px; height:17px; }

  .wa-btn{
    display:flex; align-items:center; gap:12px; padding:16px 20px; border-radius:var(--radius-m);
    background:linear-gradient(180deg,#28c76f,#1ea85a); color:#06180E; font-weight:600; font-size:14.5px;
  }
  .wa-btn svg{ width:20px; height:20px; flex:none; }
  .wa-btn:hover{ filter:brightness(1.06); }

  .contact-form{ border:1px solid var(--line); border-radius:var(--radius-l); padding:clamp(24px,3vw,36px); background:var(--ink-raised); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; color:var(--paper-dim); margin-bottom:8px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--ink-soft); border:1px solid var(--line-strong); border-radius:8px;
    padding:13px 14px; color:var(--paper); font-family:var(--font-body); font-size:14.5px;
    transition:border-color .18s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold); outline:none; }
  .field textarea{ resize:vertical; min-height:110px; }
  .form-foot{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:6px; flex-wrap:wrap; }
  .form-note{ font-size:12.5px; color:var(--paper-faint); }
  .form-status{ font-size:13.5px; margin-top:14px; color:var(--gold-bright); min-height:18px; }
  @media (max-width:900px){ .contact .container{ grid-template-columns:1fr; } }
  @media (max-width:520px){ .form-row{ grid-template-columns:1fr; } }

  /* ---------- Footer ---------- */
  .site-footer{ padding-block:56px 28px; border-top:1px solid var(--line); }
  .footer-top{ display:grid; grid-template-columns:1.4fr 0.8fr 0.8fr 1fr; gap:40px; margin-bottom:48px; }
  .footer-brand p{ color:var(--paper-dim); font-size:14px; margin-top:14px; max-width:32ch; }
  .footer-col h4{ font-size:13.5px; color:var(--paper); margin-bottom:16px; font-weight:600; }
  .footer-col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
  .footer-col a{ font-size:14px; color:var(--paper-dim); }
  .footer-col a:hover{ color:var(--gold-bright); }
  .footer-bottom{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    padding-top:26px; border-top:1px solid var(--line); font-size:13px; color:var(--paper-faint);
  }
  @media (max-width:820px){ .footer-top{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .footer-top{ grid-template-columns:1fr; } }

  /* ---------- Floating WhatsApp ------
